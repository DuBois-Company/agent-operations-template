    closed: 2026-04-27
    telemetry_rollup:
      tasks: 6
      first_attempt_passes: 5
      retries: 1
      escalations: 0
      spend: 141k tokens
      note: the retry on T3 and the retry on T8 a fortnight later are the evidence behind L3.
    nodes:

      - id: T1
        type: task
        status: done
        deliverable: token issue and verify over the compact JWS form, signed HMAC-SHA256, standard library only
        acceptance:
          - python -m unittest example.tests.test_auth -q
          - a token issued under one secret does not verify under another
        depends_on: []
        informed_by: [D1, D2]
        assigned_to: opus5
        inputs: [example/src/auth.py]
        produces: [A1]
        evidence: example/tests/test_auth.py - RoundTripTest and TamperTest
        telemetry:
          predicted: 0.75
          attempts: 1
          escalated: no
          review: pass on the first attempt
          spend: 34k tokens
        updated: {at: 2026-03-24, by: fable5}

      - id: T2
        type: task
        status: done
        deliverable: a middleware wrapper that lets a request through only when it carries a valid token
        acceptance:

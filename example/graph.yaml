        evidence: example/tests/test_auth.py - 17 tests
        telemetry:
          predicted: 0.85
          attempts: 1
          escalated: no
          review: pass on the first attempt
          spend: 22k tokens
        updated: {at: 2026-04-14, by: fable5}

      - id: T5
        type: task
        status: done
        deliverable: module docstrings for the auth core, each carrying a worked example a reader can run
        acceptance:
          - python -m unittest example.tests.test_docstrings -q

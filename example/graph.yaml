          - a protected route answers 401 when the header is absent and 401 when the token is forged
        depends_on: [T1]
        informed_by: [D1]
        assigned_to: opus5
        inputs: [example/src/middleware.py]
        evidence: example/tests/test_middleware.py - GateTest

        acceptance:
          - python -m unittest example.tests.test_auth -q
          - every rejection path raises rather than returning a value the caller could read as success
        depends_on: [T1]
        informed_by: [D1]
        assigned_to: opus5
        inputs: [example/src/auth.py]
        evidence: example/tests/test_auth.py - TamperTest
        telemetry:
          predicted: 0.7
          attempts: 2
          escalated: no
          review: pass on the second attempt - the first returned None on malformed input, which the gate would have read as a pass. The criterion had named the module and not the case.
          spend: 41k tokens
        updated: {at: 2026-04-08, by: fable5}

      - id: T4
